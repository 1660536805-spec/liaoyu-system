<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>骨骼稳定性采集器 · 弦养</title>
<style>
  body { margin:0; background:#16130f; color:#e8e0d0; font-family:system-ui,sans-serif; padding:20px; }
  h1 { font-size:18px; font-weight:500; letter-spacing:2px; }
  .row { display:flex; gap:20px; flex-wrap:wrap; margin-top:16px; }
  video, canvas { background:#000; border-radius:8px; }
  video { width:480px; transform:scaleX(-1); }
  #panel { font-size:13px; line-height:1.9; min-width:330px; }
  .big { font-size:30px; font-weight:500; }
  .ok { color:#7fb069; } .warn { color:#e8a020; } .bad { color:#c8553d; }
  button { padding:9px 20px; border-radius:8px; border:1px solid #444; background:#2c2c2a;
           color:#e8e0d0; font-size:14px; cursor:pointer; margin-right:8px; }
  button.on { background:#c8553d; border-color:#c8553d; }
  table { font-size:12px; border-collapse:collapse; margin-top:8px; }
  td,th { padding:3px 10px; border-bottom:1px solid #333; text-align:right; }
  th { color:#888780; font-weight:400; }
  .hint { color:#888780; font-size:12px; margin-top:10px; line-height:1.8; max-width:640px; }
</style>
</head>
<body>
<h1>骨骼稳定性采集器</h1>
<p class="hint">
  做法：点「开始采集」后，对着摄像头<b>依次做完八段锦八式</b>，每个式保持 3 秒。
  本页会逐帧记录关键点抖动量、跳变次数、八式命中情况，结束后自动把原始数据写入
  <code>evidence/stability-raw.json</code>。做完点「导出」把结果给我，我据此优化阈值与滤波。
</p>

<div class="row">
  <video id="v" playsinline muted autoplay></video>
  <canvas id="c" width="480" height="360"></canvas>
  <div id="panel">等待开始…</div>
</div>

<div style="margin-top:16px">
  <button id="start" class="on">开始采集</button>
  <button id="stop" disabled>停止</button>
  <button id="export" disabled>导出结果</button>
  <span id="status" style="font-size:13px;color:#888780"></span>
</div>

<table id="tbl"><thead><tr>
  <th>指标</th><th>数值</th><th>评级</th>
</tr></thead><tbody></tbody></table>

<script type="module">
const $ = (id) => document.getElementById(id)
const v = $('v'), c = $('c'), ctx = c.getContext('2d')
const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],
  [23,25],[25,27],[24,26],[26,28],[0,11],[0,12]]
const KEY = [0,11,12,13,14,15,16,23,24,25,26,27,28]
const NAME = {0:'鼻',11:'左肩',12:'右肩',13:'左肘',14:'右肘',15:'左腕',16:'右腕',
  23:'左髋',24:'右髋',25:'左膝',26:'右膝',27:'左踝',28:'右踝'}

let stream = null, running = false
let rec = null          // 当前记录
let lastLM = null       // 上一帧 landmarks
let stats = null

function newStats() {
  return {
    frames: 0,
    jerkSum: 0, jerkN: 0,           // 关键点抖动（帧间位移，肩宽归一）
    jerkMax: 0,
    jumpCount: 0,                   // 跳变次数（单帧位移 > 阈值）
    visSum: 0,
    hitLog: [],                     // {t, name, score}
    perKey: {},                     // 每关键点的抖动累计
    dts: [],
    outFrames: 0,                   // 有多少帧存在出画点
    outByKey: {},                   // 每个点出画了多少帧
  }
  for (const k of KEY) stats.outByKey[k] = 0
}
function reset() {
  lastLM = null
  stats = newStats()
  rec = { meta: { startedAt: new Date().toISOString() }, frames: [] }
  for (const k of KEY) stats.perKey[k] = { jerkSum: 0, n: 0, max: 0 }
}

async function initCam() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false })
  v.srcObject = stream
  await v.play()
  return true
}

function analyze(pose, dt) {
  const S = stats
  if (!lastLM) { lastLM = pose; return }
  // 肩宽作归一化基准
  const T = Math.hypot(pose[11].x - pose[12].x, pose[11].y - pose[12].y) || 0.16
  S.frames++
  if (dt > 0.005 && dt < 1) { S.dts.push(dt); if (S.dts.length > 600) S.dts.shift() }
  // 统计出画点（画面外 = MediaPipe 在瞎猜，坐标无物理意义）
  let anyOut = false
  for (const k of KEY) {
    const q = pose[k]
    if (!q) continue
    if (q.x < 0 || q.x > 1 || q.y < 0 || q.y > 1) { S.outByKey[k]++; anyOut = true }
  }
  if (anyOut) S.outFrames++
  let frameJerk = 0
  for (const k of KEY) {
    const a = pose[k], b = lastLM[k]
    if (!a || !b) continue
    S.visSum += (a.visibility ?? 0)
    const d = Math.hypot(a.x - b.x, a.y - b.y) / T
    frameJerk += d
    const pk = S.perKey[k]
    pk.jerkSum += d; pk.n++
    if (d > pk.max) pk.max = d
  }
  const per = frameJerk / KEY.length
  S.jerkSum += per; S.jerkN++
  if (per > S.jerkMax) S.jerkMax = per
  if (per > 0.12) S.jumpCount++      // 阈值：肩宽的 12% / 帧，经验上属真跳变
  lastLM = pose
}

function draw(pose) {
  ctx.clearRect(0, 0, c.width, c.height)
  if (!pose) return
  const X = (i) => pose[i].x * c.width, Y = (i) => pose[i].y * c.height
  ctx.lineWidth = 2
  ctx.strokeStyle = 'rgba(255,255,255,.8)'
  ctx.beginPath()
  for (const [a, b] of BONES) { ctx.moveTo(X(a), Y(a)); ctx.lineTo(X(b), Y(b)) }
  ctx.stroke()
  for (const k of KEY) {
    const a = pose[k]
    const vis = a.visibility ?? 0
    const outside = a.x < 0 || a.x > 1 || a.y < 0 || a.y > 1   // 画面外
    ctx.beginPath()
    ctx.arc(X(k), Y(k), outside ? 5 : 3.2, 0, 6.29)
    if (outside) {
      // 出画点：空心红圈 + 虚线连回画面边缘
      ctx.strokeStyle = '#c8553d'; ctx.lineWidth = 1.6; ctx.setLineDash([2, 2]); ctx.stroke(); ctx.setLineDash([])
      ctx.beginPath()
      ctx.moveTo(X(k), Y(k))
      ctx.lineTo(Math.max(0, Math.min(1, a.x)) * c.width, Math.max(0, Math.min(1, a.y)) * c.height)
      ctx.strokeStyle = 'rgba(200,85,61,.35)'; ctx.lineWidth = 1; ctx.stroke()
    } else {
      ctx.fillStyle = vis < 0.35 ? '#e8a020' : 'rgba(232,224,208,.95)'
      ctx.fill()
    }
  }
}

function render() {
  if (!stats) return                    // 尚未 reset()，无数据可渲染
  const S = stats
  const avgJerk = S.jerkN ? S.jerkSum / S.jerkN : 0
  const jumpRate = S.frames ? S.jumpCount / S.frames * 100 : 0
  const avgVis = S.frames ? S.visSum / (S.frames * KEY.length) : 0
  // 用中位数帧间隔算 fps：抗首帧异常
  let fps = 0
  if (S.dts && S.dts.length > 5) {
    const arr = [...S.dts].sort((a, b) => a - b)
    const med = arr[arr.length >> 1]
    fps = med > 0 ? 1 / med : 0
  }
  const rate = (j, good, mid) => j <= good ? ['ok','优'] : j <= mid ? ['warn','可接受'] : ['bad','需优化']

  const outRate = S.frames ? (S.outFrames / S.frames) * 100 : 0
  const rows = [
    ['出画点占比', outRate.toFixed(1) + ' %', outRate < 5 ? ['ok','优'] : outRate < 20 ? ['warn','可接受'] : ['bad','需退远'], outRate < 5 ? 'ok' : outRate < 20 ? 'warn' : 'bad'],
    ['平均抖动量', avgJerk.toFixed(4) + ' 肩宽/帧', rate(jumpRate, 2, 6)[1], rate(jumpRate, 2, 6)[0]],
    ['最大单帧抖动', S.jerkMax.toFixed(4), rate(S.jerkMax, 0.15, 0.30)[1], rate(S.jerkMax, 0.15, 0.30)[0]],
    ['跳变率', jumpRate.toFixed(2) + ' %', rate(jumpRate, 2, 6)[1], rate(jumpRate, 2, 6)[0]],
    ['平均可见度', avgVis.toFixed(3), rate(1-avgVis, 0.2, 0.4)[1], rate(1-avgVis, 0.2, 0.4)[0]],
    ['帧率', fps.toFixed(1) + ' fps', fps >= 24 ? ['ok','流畅'] : fps >= 15 ? ['warn','偏低'] : ['bad','卡顿'], fps >= 24 ? 'ok' : fps >= 15 ? 'warn' : 'bad'],
    ['采到帧数', S.frames, '-', ''],
    ['八式命中', S.hitLog.length + ' 次', S.hitLog.length >= 8 ? ['ok','全通'] : ['warn','未全通'], S.hitLog.length >= 8 ? 'ok' : 'warn'],
  ]
  $('tbl').querySelector('tbody').innerHTML = rows.map(([a, b, lv, cl]) =>
    `<tr><td style="text-align:left">${a}</td><td>${b}</td><td class="${cl}">${lv}</td></tr>`).join('')

  // 抖动最大的三个关键点
  const outWorst = Object.entries(S.outByKey || {})
    .map(([k, n]) => ({ k: +k, pct: S.frames ? (n / S.frames) * 100 : 0 }))
    .filter((x) => x.pct > 1)
    .sort((a, b) => b.pct - a.pct).slice(0, 4)
  const worst = Object.entries(S.perKey)
    .map(([k, s]) => ({ k: +k, avg: s.n ? s.jerkSum / s.n : 0, max: s.max }))
    .sort((a, b) => b.avg - a.avg).slice(0, 3)
  $('panel').innerHTML =
    `<div class="big ${worst[0] && worst[0].avg > 0.06 ? 'warn' : 'ok'}">${avgJerk.toFixed(4)}</div>
     <div style="color:#888780;font-size:12px">平均抖动（肩宽/帧）</div>
     <div style="margin-top:12px;font-size:12px;color:#888780">抖动最大的关键点</div>` +
    worst.map(w => `<div>${NAME[w.k] || w.k} <span style="color:#e8e0d0">均 ${w.avg.toFixed(4)} / 峰 ${w.max.toFixed(4)}</span></div>`).join('') +
    (outWorst.length ? `<div style="margin-top:12px;font-size:12px;color:#c8553d">出画点（数据不可信）</div>` +
      outWorst.map(w => `<div>${NAME[w.k] || w.k} <span style="color:#c8553d">${w.pct.toFixed(0)}% 帧在画面外</span></div>`).join('') : '') +
    (S.hitLog.length ? `<div style="margin-top:12px;font-size:12px;color:#888780">已命中</div>` +
      S.hitLog.map(h => `<div style="font-size:12px">${h.name} <span style="color:#888780">${h.score.toFixed(2)}</span></div>`).join('') : '')
}

async function loop() {
  if (!running) return
  const { PoseLandmarker, FilesetResolver } = await import('/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs')
  if (!window.__lm) {
    const fs = await FilesetResolver.forVisionTasks('/wasm')
    window.__lm = await PoseLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: '/models/pose_landmarker_lite.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numPoses: 1,
      minPoseDetectionConfidence: 0.3, minPosePresenceConfidence: 0.3, minTrackingConfidence: 0.3,
    })
    window.__T = performance.now()
  }
  const t = performance.now()
  const dt = (t - window.__T) / 1000; window.__T = t
  if (v.readyState >= 2) {
    try {
      const r = window.__lm.detectForVideo(v, t)
      const pose = r.landmarks && r.landmarks[0]
      if (pose) {
        analyze(pose, dt)
        draw(pose)
        rec.frames.push({
          t: +((t - rec.meta.startTs) / 1000).toFixed(3),
          k: KEY.map(i => [+pose[i].x.toFixed(4), +pose[i].y.toFixed(4), +(pose[i].visibility ?? 0).toFixed(3)]),
        })
        // 顺带跑判定器看命中
        if (!window.__judge) {
          const { MoveJudge } = await import('/src/engine/judge.js')
          window.__judge = new MoveJudge({ holdFrames: 10, order: null })
        }
        const pts = KEY.map(i => ({ x: pose[i].x, y: pose[i].y, z: 0, visibility: pose[i].visibility ?? 0 }))
        const hits = window.__judge.update(pts)
        for (const h of hits) {
          stats.hitLog.push({ name: h.name, score: +h.score.toFixed(2), t: +((t - rec.meta.startTs) / 1000).toFixed(1) })
        }
        $('status').textContent = `采集中… ${stats.frames} 帧 / ${(t - rec.meta.startTs) / 1000 | 0}s`
      }
    } catch (e) { console.error(e) }
  }
  requestAnimationFrame(loop)
}

$('start').onclick = async () => {
  $('status').textContent = '正在打开摄像头…'
  try {
    if (!stream) await initCam()
    reset()
    rec.meta.startTs = performance.now()
    running = true
    $('start').disabled = true; $('stop').disabled = false; $('export').disabled = true
    loop()
  } catch (e) {
    $('status').textContent = '摄像头打开失败：' + (e.message || e)
  }
}
$('stop').onclick = () => {
  running = false
  $('start').disabled = false; $('stop').disabled = true; $('export').disabled = false
  rec.meta.frames = stats.frames
  rec.meta.avgJerk = +(stats.jerkN ? stats.jerkSum / stats.jerkN : 0).toFixed(5)
  rec.meta.maxJerk = +stats.jerkMax.toFixed(5)
  rec.meta.jumpCount = stats.jumpCount
  rec.meta.avgVis = +(stats.frames ? stats.visSum / (stats.frames * KEY.length) : 0).toFixed(4)
  const _d = [...stats.dts].sort((a,b)=>a-b); const _m = _d[_d.length>>1]
  rec.meta.fps = +(_m > 0 ? 1/_m : 0).toFixed(1)
  rec.meta.hits = stats.hitLog
  rec.meta.outFrames = stats.outFrames
  rec.meta.outByKey = stats.outByKey
  rec.meta.perKey = stats.perKey
  $('status').textContent = '已停止，可点「导出结果」'
  render()
}
$('export').onclick = () => {
  const blob = new Blob([JSON.stringify(rec, null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'stability-raw.json'
  a.click()
  $('status').textContent = `已导出 ${stats.frames} 帧。请把文件放到 xianyang/evidence/ 目录，或直接把面板数值告诉我。`
}
window.addEventListener('beforeunload', () => stream && stream.getTracks().forEach(t => t.stop()))
render()
</script>
</body>
</html>
